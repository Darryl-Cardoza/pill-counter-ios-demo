name: iOS CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:

  extract-version:
    name: Extract App Version
    runs-on: macos-latest

    outputs:
      version: ${{ steps.v.outputs.version }}
      scheme: ${{ steps.detect.outputs.scheme }}
      workspace: ${{ steps.detect.outputs.workspace }}
      project: ${{ steps.detect.outputs.project }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Extract Version
      # -----------------------------

      - id: v
        run: |
          set -euo pipefail

          PLIST_PATH=$(find . -name "Info.plist" | head -n 1)

          if [ -z "$PLIST_PATH" ]; then
            echo "❌ Could not locate Info.plist"
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print CFBundleShortVersionString" \
            "$PLIST_PATH")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      # -----------------------------
      # Detect workspace/project
      # -----------------------------

      - id: detect
        run: |
          set -e

          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1 || true)
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
            echo "project=" >> $GITHUB_OUTPUT
            FILE="$WORKSPACE"
          else
            echo "workspace=" >> $GITHUB_OUTPUT
            echo "project=$PROJECT" >> $GITHUB_OUTPUT
            FILE="$PROJECT"
          fi

          echo "Detected file: $FILE"

          # Extract scheme
          SCHEME=$(xcodebuild -list -json \
            ${WORKSPACE:+-workspace "$WORKSPACE"} \
            ${PROJECT:+-project "$PROJECT"} \
            | /usr/bin/python3 -c "import sys, json; print(json.load(sys.stdin)['project']['schemes'][0])")

          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Detected scheme: $SCHEME"

  # -----------------------------
  # CI
  # -----------------------------

  call-ci:
    name: Call Reusable iOS CI
    needs: extract-version

    uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/workflows/push.yml@main

    with:
      scheme: ${{ needs.extract-version.outputs.scheme }}
      workspace: ${{ needs.extract-version.outputs.workspace }}
      project: ${{ needs.extract-version.outputs.project }}

      configuration: "Release"
      coverage_threshold: "30.00"

      build_archive: true
      run_tests: false
      run_coverage: false
      run_static_analysis: false

  # -----------------------------
  # CD
  # -----------------------------

  call-cd:
    name: Call Reusable iOS CD
    needs: [extract-version, call-ci]

    if: github.event_name == 'pull-request' && github.ref == 'refs/heads/main'

    uses: Rite-Technologies-23/ops-rite-ios-pipeline/.github/workflows/release.yml@main

    with:
      version: ${{ needs.extract-version.outputs.version }}

      deploy_to_testflight: true
      ios_bundle_id: "com.ritetechnologies.PillCounting"

      enable_whats_new: false
      whats_new_file: playstore/metadata/en-US/whatsnew.txt

    secrets:
      IOS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}